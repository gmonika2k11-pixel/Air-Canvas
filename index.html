<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Air Canvas - Complete Samsung FailSafe</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background: #111111; 
            font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-user-select: none;
        }
        #container { position: relative; width: 100vw; height: 100vh; }
        
        /* 🔥 FALLBACK GRAPHICS SYSTEM RENDERING MAP */
        video { 
            transform: scaleX(-1); position: absolute; width: 100%; height: 100%; 
            object-fit: cover; opacity: 0.45; z-index: 1; background: #111111;
        }
        canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            transform: scaleX(-1); z-index: 2; pointer-events: none;
        }
        #targetBox {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70px; height: 70px; border: 4px dashed #ff3399; border-radius: 8px;
            z-index: 5; pointer-events: none;
        }
        #menu { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            display: flex; gap: 12px; background: rgba(255, 255, 255, 0.2); 
            padding: 10px 20px; border-radius: 50px; backdrop-filter: blur(10px); 
            z-index: 10; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .btn { width: 44px; height: 44px; border-radius: 50%; border: 2px solid white; cursor: pointer; }
        #red { background: #FF3333; } #orange { background: #FF9933; } #yellow { background: #FFFF33; }
        #green { background: #33FF33; } #cyan { background: #33FFFF; } #blue { background: #3333FF; }
        #purple { background: #9933FF; } #pink { background: #FF3399; }
        #eraser { background: #444444; border-color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        #clear { background: #222222; border-color: #FF3333; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        #status { 
            position: absolute; bottom: 20px; left: 20px; color: white; 
            background: rgba(0, 0, 0, 0.85); padding: 12px 24px; border-radius: 30px; z-index: 10;
        }
        #calibrateBtn {
            position: absolute; bottom: 20px; right: 20px; background: #ff3399; color: white;
            border: none; padding: 12px 24px; border-radius: 30px; font-weight: bold; z-index: 10;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="targetBox"></div>
    <!-- Added hardware streaming configurations preventing black canvas fallouts -->
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="paintCanvas"></canvas>
    
    <div id="menu">
        <div class="btn" id="red" onclick="setColor('#FF3333', 'Neon Red')"></div>
        <div class="btn" id="orange" onclick="setColor('#FF9933', 'Neon Orange')"></div>
        <div class="btn" id="yellow" onclick="setColor('#FFFF33', 'Neon Yellow')"></div>
        <div class="btn" id="green" onclick="setColor('#33FF33', 'Neon Green')"></div>
        <div class="btn" id="cyan" onclick="setColor('#33FFFF', 'Neon Cyan')"></div>
        <div class="btn" id="blue" onclick="setColor('#3333FF', 'Neon Blue')"></div>
        <div class="btn" id="purple" onclick="setColor('#9933FF', 'Neon Purple')"></div>
        <div class="btn" id="pink" onclick="setColor('#FF3399', 'Neon Pink')"></div>
        <div class="btn" id="eraser" onclick="setEraser()">🧼</div>
        <div class="btn" id="clear" onclick="clearCanvas()">❌</div>
    </div>

    <div id="status">Place unique color cap inside square -> Tap Calibrate Color</div>
    <button id="calibrateBtn" onclick="startCalibration()">🎯 Calibrate Color</button>
</div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');
const statusDiv = document.getElementById('status');
const targetBox = document.getElementById('targetBox');

let currentColor = '#FF3333'; 
let currentThickness = 8;
let lastX = 0, lastY = 0;
let wasTracking = false;

let targetH = 0, targetS = 0, targetV = 0;
let isCalibrated = false;
let isCalibrating = false;

function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    let max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, v = max;
    let d = max - min;
    s = max === 0 ? 0 : d / max;
    if (max === min) { h = 0; } else {
        switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
    }
    return [h * 360, s * 100, v * 100];
}

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.shadowBlur = 8; ctx.shadowColor = currentColor;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function setColor(hexColor, name) {
    currentColor = hexColor; currentThickness = 8;
    ctx.shadowBlur = 8; ctx.shadowColor = currentColor;
    statusDiv.innerText = `Active Color: ${name}`;
}

function setEraser() {
    currentColor = '#111111'; currentThickness = 60; ctx.shadowBlur = 0;
    statusDiv.innerText = "Active Tool: Eraser Pad";
}

function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    statusDiv.innerText = "Canvas Cleared!";
}

function startCalibration() {
    isCalibrating = true;
    statusDiv.innerText = "Configuring color arrays locks...";
}

function processFrame() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 160; tempCanvas.height = 120;
        const tempCtx = tempCanvas.getContext('2d');
        
        tempCtx.translate(tempCanvas.width, 0);
        tempCtx.scale(-1, 1);
        tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
        
        const frameData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = frameData.data;
        let sumX = 0, sumY = 0, count = 0;
        
        if (isCalibrating) {
            let midX = Math.floor(tempCanvas.width / 2);
            let midY = Math.floor(tempCanvas.height / 2);
            let idx = (midY * tempCanvas.width + midX) * 4;
            let hsv = rgbToHsv(data[idx], data[idx+1], data[idx+2]);
            targetH = hsv[0]; targetS = hsv[1]; targetV = hsv[2];
            isCalibrating = false; isCalibrated = true;
            targetBox.style.borderColor = "#33ff33";
            statusDiv.innerText = "Target Locked! Back up and paint.";
        }

        if (isCalibrated) {
            for (let y = 0; y < tempCanvas.height; y++) {
                for (let x = 0; x < tempCanvas.width; x++) {
                    const idx = (y * tempCanvas.width + x) * 4;
                    const hsv = rgbToHsv(data[idx], data[idx+1], data[idx+2]);
                    const hDist = Math.min(Math.abs(hsv[0] - targetH), 360 - Math.abs(hsv[0] - targetH));
                    
                    if (hDist < 22 && hsv[1] > 20 && hsv[2] > 20) {
                        sumX += x; sumY += y; count++;
                    }
                }
            }
            if (count > 6 && count < 350) {
                const posX = (sumX / count) / tempCanvas.width * canvas.width;
                const posY = (sumY / count) / tempCanvas.height * canvas.height;
                if (wasTracking) {
                    const jumpDistance = Math.sqrt((posX - lastX)**2 + (posY - lastY)**2);
                    if (jumpDistance < 150) {
                        ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(posX, posY);
                        ctx.strokeStyle = currentColor; ctx.lineWidth = currentThickness; ctx.stroke();
                    }
                }
                lastX = posX; lastY = posY; wasTracking = true;
            } else { wasTracking = false; }
        }
    }
    requestAnimationFrame(processFrame);
}

async function initSystem() {
    try {
        const constraints = {
            audio: false,
            video: {
                facingMode: "user",
                width: { ideal: 640 },
                height: { ideal: 480 }
            }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        // Fix for Samsung native browser playback engines
        video.setAttribute('autoplay', '');
        video.setAttribute('playsinline', '');
        video.play();
        requestAnimationFrame(processFrame);
    } catch (err) {
        statusDiv.innerText = "⚠️ Hardware Stream Blocked. Check Step 1 and Step 2 instructions.";
    }
}
window.onload = initSystem;
</script>
</body>
</html>
