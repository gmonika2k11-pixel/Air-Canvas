<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Neon Virtual Canvas - 8 Colors Edition</title>
    <!-- Load MediaPipe Frameworks via CDN -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #111111; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }
        video { 
            transform: scaleX(-1); 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            opacity: 0.2; 
        }
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            transform: scaleX(-1); 
        }
        /* Expanded Floating Rainbow Color Menu Layout */
        #menu { 
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 12px; 
            background: rgba(255, 255, 255, 0.15); 
            padding: 10px 20px; 
            border-radius: 50px; 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            z-index: 10; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn { 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            border: 2px solid white; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn:active {
            transform: scale(0.85);
        }
        /* Neon Palette Color Definitions */
        #red    { background: #FF3333; box-shadow: 0 0 10px #FF3333; }
        #orange { background: #FF9933; box-shadow: 0 0 10px #FF9933; }
        #yellow { background: #FFFF33; box-shadow: 0 0 10px #FFFF33; }
        #green  { background: #33FF33; box-shadow: 0 0 10px #33FF33; }
        #cyan   { background: #33FFFF; box-shadow: 0 0 10px #33FFFF; }
        #blue   { background: #3333FF; box-shadow: 0 0 10px #3333FF; }
        #purple { background: #9933FF; box-shadow: 0 0 10px #9933FF; }
        #pink   { background: #FF3399; box-shadow: 0 0 10px #FF3399; }
        
        #eraser { background: #444444; border-color: #ffffff; }
        #clear  { background: #222222; border-color: #FF3333; }
        
        #status { 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            color: white; 
            background: rgba(0, 0, 0, 0.75); 
            padding: 12px 24px; 
            border-radius: 30px; 
            font-weight: 500;
            z-index: 10; 
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

<div id="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="paintCanvas"></canvas>
    
    <!-- Expanded Floating Rainbow Palette Menu UI Layout -->
    <div id="menu">
        <div class="btn" id="red" onclick="setColor('#FF3333', 'Neon Red')"></div>
        <div class="btn" id="orange" onclick="setColor('#FF9933', 'Neon Orange')"></div>
        <div class="btn" id="yellow" onclick="setColor('#FFFF33', 'Neon Yellow')"></div>
        <div class="btn" id="green" onclick="setColor('#33FF33', 'Neon Green')"></div>
        <div class="btn" id="cyan" onclick="setColor('#33FFFF', 'Neon Cyan')"></div>
        <div class="btn" id="blue" onclick="setColor('#3333FF', 'Neon Blue')"></div>
        <div class="btn" id="purple" onclick="setColor('#9933FF', 'Neon Purple')"></div>
        <div class="btn" id="pink" onclick="setColor('#FF3399', 'Neon Pink')"></div>
        <div class="btn" id="eraser" onclick="setEraser()">🧼</div>
        <div class="btn" id="clear" onclick="clearCanvas()">❌</div>
    </div>

    <div id="status">System Status: Booting Video Engines...</div>
</div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');
const statusDiv = document.getElementById('status');

// Runtime Configuration Settings
let currentColor = '#FF3333'; 
let currentThickness = 8;
let lastX = 0, lastY = 0;
let isDrawing = false;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Palette Controller Updates
function setColor(hexColor, name) {
    currentColor = hexColor;
    currentThickness = 8;
    statusDiv.innerText = `Active Tool: ${name}`;
}

function setEraser() {
    currentColor = '#111111'; // Match body canvas layer background
    currentThickness = 60;     // Wide footprint mask diameter
    statusDiv.innerText = "Active Tool: Eraser Pad";
}

function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    statusDiv.innerText = "Canvas Cleared!";
}

// MediaPipe Multi-Hand Vector Computation Loops
function onResults(results) {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const hand = results.multiHandLandmarks[0];
        
        const indexTip = hand[8];
        const middleTip = hand[12];
        const indexPip = hand[6];
        const middlePip = hand[10];

        const x = indexTip.x * canvas.width;
        const y = indexTip.y * canvas.height;

        const indexUp = indexTip.y < indexPip.y;
        const middleUp = middleTip.y < middlePip.y;

        if (indexUp && middleUp) {
            statusDiv.innerText = "Status: 🖐️ Navigation Mode (Paused)";
            isDrawing = false;
        } else if (indexUp && !middleUp) {
            statusDiv.innerText = "Status: ✍️ Drawing Art";
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentThickness;
            
            if (!isDrawing) {
                isDrawing = true;
                lastX = x;
                lastY = y;
            }
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            
            lastX = x;
            lastY = y;
        }
    } else {
        statusDiv.innerText = "Status: Idle - Hand Out of Bounds";
        isDrawing = false;
    }
}

// Hardware-Accelerated Processing Instance Config
const hands = new Hands({
    locateFile: (file) => `https://jsdelivr.net{file}`
});

hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 0,          // ⚡ Light model for tablet processor efficiency
    minDetectionConfidence: 0.5, 
    minTrackingConfidence: 0.5   
});
hands.onResults(onResults);

const camera = new Camera(video, {
    onFrame: async () => {
        await hands.send({image: video});
    },
    width: 640,
    height: 480
});
camera.start();
</script>

</body>
</html>
