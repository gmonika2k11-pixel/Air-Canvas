<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Neon Sketch Canvas - School Exhibition Edition</title>
    <style>
        /* Core Document Layout Styling */
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #111111; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Prevents the tablet window from panning or scrolling while drawing */
        }
        #container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }
        
        /* High-Performance Canvas Graphics Board Layer */
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 1;
            cursor: crosshair;
        }
        
        /* Floating Responsive Rainbow Button Menu UI Layout */
        #menu { 
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 12px; 
            background: rgba(255, 255, 255, 0.15); 
            padding: 10px 20px; 
            border-radius: 50px; 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            z-index: 10; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn { 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            border: 2px solid white; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }
        .btn:active { transform: scale(0.85); }
        
        /* Custom Neon Colors Configurations with Glowing Drop Shadows */
        #red    { background: #FF3333; box-shadow: 0 0 12px #FF3333; }
        #orange { background: #FF9933; box-shadow: 0 0 12px #FF9933; }
        #yellow { background: #FFFF33; box-shadow: 0 0 12px #FFFF33; }
        #green  { background: #33FF33; box-shadow: 0 0 12px #33FF33; }
        #cyan   { background: #33FFFF; box-shadow: 0 0 12px #33FFFF; }
        #blue   { background: #3333FF; box-shadow: 0 0 12px #3333FF; }
        #purple { background: #9933FF; box-shadow: 0 0 12px #9933FF; }
        #pink   { background: #FF3399; box-shadow: 0 0 12px #FF3399; }
        
        #eraser { background: #444444; border-color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        #clear  { background: #222222; border-color: #FF3333; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        
        /* HUD Console Information Terminal Window */
        #status { 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            color: white; 
            background: rgba(0, 0, 0, 0.75); 
            padding: 12px 24px; 
            border-radius: 30px; 
            font-weight: 500;
            z-index: 10; 
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

<div id="container">
    <!-- Main Drawing Layer Window Board -->
    <canvas id="paintCanvas"></canvas>
    
    <!-- User Input Control Floating Panel Elements Menu -->
    <div id="menu">
        <div class="btn" id="red" onclick="setColor('#FF3333', 'Neon Red')"></div>
        <div class="btn" id="orange" onclick="setColor('#FF9933', 'Neon Orange')"></div>
        <div class="btn" id="yellow" onclick="setColor('#FFFF33', 'Neon Yellow')"></div>
        <div class="btn" id="green" onclick="setColor('#33FF33', 'Neon Green')"></div>
        <div class="btn" id="cyan" onclick="setColor('#33FFFF', 'Neon Cyan')"></div>
        <div class="btn" id="blue" onclick="setColor('#3333FF', 'Neon Blue')"></div>
        <div class="btn" id="purple" onclick="setColor('#9933FF', 'Neon Purple')"></div>
        <div class="btn" id="pink" onclick="setColor('#FF3399', 'Neon Pink')"></div>
        <div class="btn" id="eraser" onclick="setEraser()">🧼</div>
        <div class="btn" id="clear" onclick="clearCanvas()">❌</div>
    </div>

    <!-- Telemetry System HUD Console Display -->
    <div id="status">System Status: Ready for Finger or Stylus Input...</div>
</div>

<script>
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');
const statusDiv = document.getElementById('status');

// Runtime Global Parameters Configuration
let currentColor = '#FF3333'; 
let currentThickness = 6;
let isDrawing = false;
let lastX = 0;
let lastY = 0;

// Adapt Canvas Dimension Grid Spaces Dynamically
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    // Antialiasing line smoothing paths parameters configurations
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    // Add real time visual light blur glow layers to drawing strokes
    ctx.shadowBlur = 12;
    ctx.shadowColor = currentColor;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// User Palette Management Trigger Routines
function setColor(hexColor, name) {
    currentColor = hexColor;
    currentThickness = 6;
    ctx.shadowBlur = 12;
    ctx.shadowColor = currentColor;
    statusDiv.innerText = `Active Tool: ${name}`;
}

function setEraser() {
    currentColor = '#111111'; // Overwrites vector fields with backdrop shades to clear lines
    currentThickness = 50;     
    ctx.shadowBlur = 0;       // Suppresses line drop shadow glow during erase cycles
    statusDiv.innerText = "Active Tool: Eraser Pad";
}

function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    statusDiv.innerText = "Canvas Cleared!";
}

// NATIVE POINTER EVENT INTERFACES (Perfectly traces touch and stylus pen tips)
function startDrawing(e) {
    isDrawing = true;
    
    // Accurately isolates device layout coordinates mapping screen space configurations
    lastX = e.clientX;
    lastY = e.clientY;
    
    const pointerType = e.pointerType ? e.pointerType.toUpperCase() : "POINTER";
    statusDiv.innerText = `Status: Tracing active ${pointerType} Input`;
}

function draw(e) {
    if (!isDrawing) return;
    
    // Stops Android OS from interpreting standard canvas touch strokes as page sliding actions
    e.preventDefault(); 
    
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(e.clientX, e.clientY);
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentThickness;
    ctx.stroke();
    
    lastX = e.clientX;
    lastY = e.clientY;
}

function stopDrawing() {
    isDrawing = false;
    statusDiv.innerText = "Status: Idle - Ready to Draw";
}

/* Attaches global cross-platform Pointer Listeners tracking points instantly */
canvas.addEventListener('pointerdown', startDrawing);
canvas.addEventListener('pointermove', draw);
canvas.addEventListener('pointerup', stopDrawing);
canvas.addEventListener('pointercancel', stopDrawing);
</script>

</body>
</html>
