<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Virtual Canvas for Tablet</title>
    <!-- Load MediaPipe and Camera Utils via CDN -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #111; font-family: Arial, sans-serif; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video { transform: scaleX(-1); position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.3; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
        #menu { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; background: rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 50px; backdrop-filter: blur(10px); z-index: 10; }
        .btn { width: 50px; height: 50px; border-radius: 50%; border: 3px solid white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        #red { background: red; } #blue { background: blue; } #green { background: green; } #eraser { background: #555; font-size: 12px; }
        #clear { background: black; border-color: red; font-size: 12px; }
        #status { position: absolute; bottom: 20px; left: 20px; color: white; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 5px; z-index: 10; }
    </style>
</head>
<body>

<div id="container">
    <!-- Camera Feed (Hidden or faint background) -->
    <video id="webcam" autoplay playsinline></video>
    <!-- Drawing Canvas -->
    <canvas id="paintCanvas"></canvas>
    
    <!-- UI Menu -->
    <div id="menu">
        <div class="btn" id="red" onclick="setColor('red')"></div>
        <div class="btn" id="blue" onclick="setColor('blue')"></div>
        <div class="btn" id="green" onclick="setColor('green')"></div>
        <div class="btn" id="eraser" onclick="setColor('erase')">🧼</div>
        <div class="btn" id="clear" onclick="clearCanvas()">❌</div>
    </div>

    <div id="status">Gesture Status: Detecting Hand...</div>
</div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');
const statusDiv = document.getElementById('status');

let brushColor = 'red';
let brushThickness = 8;
let lastX = 0, lastY = 0;
let isDrawing = false;

// Resize canvas to fill the screen layout
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
}
window.addEventListener('resize', resize);
resize();

function setColor(color) {
    if (color === 'erase') {
        brushColor = '#111'; // Match body background to act as an eraser
        brushThickness = 40;
    } else {
        brushColor = color;
        brushThickness = 8;
    }
}

function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// Handle tracking results from MediaPipe
function onResults(results) {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const hand = results.multiHandLandmarks[0];
        
        // Landmark 8 = Index Tip, Landmark 12 = Middle Tip
        const indexTip = hand[8];
        const middleTip = hand[12];
        const indexPip = hand[6];
        const middlePip = hand[10];

        // Convert normalized coordinates [0,1] to actual screen pixels
        const x = indexTip.x * canvas.width;
        const y = indexTip.y * canvas.height;

        // Gestures Logic: Finger Up check (Y coordinate decreases as hand goes up)
        const indexUp = indexTip.y < indexPip.y;
        const middleUp = middleTip.y < middlePip.y;

        if (indexUp && middleUp) {
            // SELECTION MODE (Two fingers up) -> Stop drawing
            statusDiv.innerText = "Status: Selection Mode (Hover to change colors)";
            isDrawing = false;
            
            // Check button collision based on screen positions if needed, 
            // or let visitors click the UI physically with their left hand!
        } else if (indexUp && !middleUp) {
            // DRAWING MODE (Only Index finger up)
            statusDiv.innerText = "Status: ✍️ Drawing";
            ctx.strokeStyle = brushColor;
            ctx.lineWidth = brushThickness;
            
            if (!isDrawing) {
                isDrawing = true;
                lastX = x;
                lastY = y;
            }
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            
            lastX = x;
            lastY = y;
        }
    } else {
        statusDiv.innerText = "Status: No hand detected";
        isDrawing = false;
    }
}

// Initialise MediaPipe Hands Model
const hands = new Hands({
    locateFile: (file) => `https://jsdelivr.net{file}`
});
hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7
});
hands.onResults(onResults);

// Stream tablet camera to the app
const camera = new Camera(video, {
    onFrame: async () => {
        await hands.send({image: video});
    },
    width: 1280,
    height: 720
});
camera.start();
</script>

</body>
</html>
