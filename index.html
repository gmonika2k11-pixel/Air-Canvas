<!DOCTYPE html>
<html lang="en">
<head>

    <title>AI Air Canvas - T515 High Performance HSV Edition</title>
    <style>
        /* Core Document Layout Styling */
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #111111; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none;
            -webkit-user-select: none;
        }
        #container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }
        
        /* Video Background Feed Setup */
        video { 
            transform: scaleX(-1); 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            opacity: 0.35; 
            z-index: 1;
        }
        
        /* Transparent Canvas Sketching Layer Pane */
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            transform: scaleX(-1); 
            z-index: 2;
        }
        
        /* TARGET CALIBRATION OVERLAY SQUARE */
        #targetBox {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 4px dashed #ff3399;
            border-radius: 8px;
            z-index: 5;
            box-shadow: 0 0 15px rgba(255, 51, 153, 0.5);
            pointer-events: none;
        }

        /* Floating Responsive Rainbow Button Menu Layout */
        #menu { 
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 12px; 
            background: rgba(255, 255, 255, 0.2); 
            padding: 10px 20px; 
            border-radius: 50px; 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            z-index: 10; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn { 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            border: 2px solid white; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }
        .btn:active { transform: scale(0.85); }
        
        /* Custom Neon Colors Configurations */
        #red    { background: #FF3333; box-shadow: 0 0 10px #FF3333; }
        #orange { background: #FF9933; box-shadow: 0 0 10px #FF9933; }
        #yellow { background: #FFFF33; box-shadow: 0 0 10px #FFFF33; }
        #green  { background: #33FF33; box-shadow: 0 0 10px #33FF33; }
        #cyan   { background: #33FFFF; box-shadow: 0 0 10px #33FFFF; }
        #blue   { background: #3333FF; box-shadow: 0 0 10px #3333FF; }
        #purple { background: #9933FF; box-shadow: 0 0 10px #9933FF; }
        #pink   { background: #FF3399; box-shadow: 0 0 10px #FF3399; }
        #eraser { background: #444444; border-color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        #clear  { background: #222222; border-color: #FF3333; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        
        /* Status Telemetry Control HUD Window */
        #status { 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            color: white; 
            background: rgba(0, 0, 0, 0.85); 
            padding: 12px 24px; 
            border-radius: 30px; 
            font-weight: 500;
            z-index: 10; 
            border: 1px solid rgba(255,255,255,0.15);
        }
        #calibrateBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #ff3399;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            z-index: 10;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,51,153,0.4);
        }
    </style>
</head>

// Translates raw RGB pixel matrix vectors into mathematical HSV spaces
function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    let max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, v = max;
    let d = max - min;
    s = max === 0 ? 0 : d / max;

        }
        h /= 6;
    }
    return [h * 360, s * 100, v * 100];
}

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowBlur = 8;
    ctx.shadowColor = currentColor;
}
window.addEventListener('resize', resizeCanvas);

    currentColor = hexColor;
    currentThickness = 8;
    ctx.shadowBlur = 8;

</html>
